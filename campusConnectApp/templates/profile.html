{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">

    <h4 class="mb-3 text-center">My Profile</h4>

    <div class="card shadow-sm mb-3">
      <div class="card-body">

        <form method="post">
          {% csrf_token %}

          <h6>User Info</h6>
          {{ u_form.as_p }}

          <hr>

          <h6>Profile Info</h6>
          {{ p_form.as_p }}

          <button class="btn btn-primary w-100 mt-2">Update Profile</button>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
