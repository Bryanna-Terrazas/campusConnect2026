{% extends "base.html" %}

{% block content %}

<h4 class="mb-3">Create Event</h4>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">

    <div class="card shadow-sm">
      <div class="card-body">

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-success w-100">  Create Event</button>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
