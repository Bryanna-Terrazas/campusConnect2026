{% extends "base.html" %}

{% block content %}
<h4>Events</h4>

<a class="btn btn-primary mb-3" href="{% url 'event_create' %}">Create Event</a>

<ul class="list-group">
  {% for event in events %}
    <li class="list-group-item d-flex justify-content-between">
      <div>
        <strong>{{ event.title }}</strong><br>
        {{ event.description }}<br>
        {{ event.date }} | {{ event.category }}
      </div>

      <div>
        <a class="btn btn-sm btn-warning" href="{% url 'event_edit' event.id %}">Edit</a>
        <a class="btn btn-sm btn-danger" href="{% url 'event_delete' event.id %}">Delete</a>
      </div>
    </li>
  {% empty %}
    <li class="list-group-item">No events yet.</li>
  {% endfor %}
</ul>

{% endblock %}
